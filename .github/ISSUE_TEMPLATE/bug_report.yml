name: "🪲 Informar de un error"
description: "La aplicación no funciona como se esperaba"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por dedicar tiempo a informar del problema!

        > **No adjuntes volcados EEPROM aquí.** Contienen el VIN, el identificador del inmovilizador y el código PIN de un vehículo real. Si necesitamos el volcado, acordaremos una forma privada de recibirlo.
  - type: input
    id: version
    attributes:
      label: "Versión de la herramienta"
      description: "Aparece junto al nombre en la barra de título."
      placeholder: "Por ejemplo: v1.1.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: "Versión de Windows"
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: input
    id: ecu
    attributes:
      label: "Centralita (ECU)"
      description: "Referencia Bosch y referencia VAG, si el problema ocurre con un volcado concreto."
      placeholder: "Por ejemplo: Bosch 0281010390, VAG 038906019FN, EDC15P+"
  - type: textarea
    id: description
    attributes:
      label: "¿Qué ha ocurrido?"
      description: "¿Qué esperabas y qué ha ocurrido? Copia el texto exacto de cualquier mensaje o aviso."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducirlo"
      placeholder: |
        1. Abre el archivo...
        2. Cambia...
        3. Pulsa «Guardar archivo»...
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: "Captura de pantalla"
      description: "Una captura puede ayudar. Si quieres, oculta el VIN y el identificador del inmovilizador."

