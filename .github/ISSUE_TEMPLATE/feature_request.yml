name: "💡 Solicitar una mejora"
description: "Propón una idea o mejora"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "¿Qué problema resolvería?"
      placeholder: "En el taller a menudo necesito..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Solución propuesta"
      description: "Describe qué te gustaría que hiciera el programa."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternativas que has considerado"
  - type: checkboxes
    id: contribute
    attributes:
      label: "Colaboración"
      options:
        - label: "Me gustaría ayudar a implementarlo"

