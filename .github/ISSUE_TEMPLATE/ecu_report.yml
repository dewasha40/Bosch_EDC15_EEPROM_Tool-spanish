name: "🚗 Informar de compatibilidad de ECU"
description: "Indica si la herramienta funciona con tu centralita EDC15"
title: "[ECU] <referencia Bosch> <vehículo>"
labels: ["ecu-report"]
body:
  - type: markdown
    attributes:
      value: |
        Los informes de uso real permiten saber qué variantes EDC15 comparten la estructura compatible. ¡Gracias!

        > **No adjuntes el volcado.** Contiene el VIN, el identificador del inmovilizador y el código PIN del vehículo.
  - type: input
    id: bosch
    attributes:
      label: "Referencia Bosch"
      description: "Está impresa en la etiqueta de la centralita y empieza por 0281."
      placeholder: "Por ejemplo: 0281010390"
    validations:
      required: true
  - type: input
    id: vag
    attributes:
      label: "Referencia VAG y tipo de ECU"
      placeholder: "Por ejemplo: 038906019FN, EDC15P+"
  - type: input
    id: vehicle
    attributes:
      label: "Vehículo"
      placeholder: "Marca, modelo, año y código de motor (por ejemplo: VW Golf IV 2002, ASZ)"
    validations:
      required: true
  - type: dropdown
    id: eeprom
    attributes:
      label: "Chip EEPROM de la placa"
      options:
        - 24C04 (512 bytes)
        - 95040 / 95080 / 95160
        - No lo sé
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: "Resultado en la herramienta"
      options:
        - "✅ El archivo se abrió y todos los valores parecen correctos"
        - "⚠️ El archivo se abrió, pero algunos valores parecen incorrectos"
        - "❌ No se pudo abrir o aparece «No reconocido»"
    validations:
      required: true
  - type: checkboxes
    id: values
    attributes:
      label: "Valores que se leyeron correctamente"
      options:
        - label: "Estado del inmovilizador"
        - label: "Kilometraje"
        - label: "Código PIN"
        - label: "VIN"
        - label: "Identificador del inmovilizador"
  - type: dropdown
    id: car
    attributes:
      label: "¿Funcionó en el vehículo el archivo guardado?"
      options:
        - No lo he probado
        - Sí
        - No
  - type: textarea
    id: notes
    attributes:
      label: "Notas"
      description: "Añade cualquier otro dato útil, como los avisos que mostró la herramienta o cómo se leyó el volcado."

